<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard Bel Sekolah</title>
    <style>
        *{box-sizing:border-box}
        body{
            margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
            font-family:Arial,Helvetica,sans-serif; background:#0f172a; color:#e2e8f0;
            padding:20px;
        }
        .login-card{
            width:100%; max-width:420px; background:#1e293b; border:1px solid #334155;
            border-radius:20px; padding:32px; box-shadow:0 20px 60px rgba(0,0,0,.35);
        }
        .logo{font-size:48px;text-align:center;margin-bottom:8px}
        h1{text-align:center;margin:0 0 8px;font-size:26px}
        .subtitle{text-align:center;color:#94a3b8;margin:0 0 28px}
        label{display:block;margin:0 0 8px;font-weight:700}
        input{
            width:100%; padding:13px 14px; border:1px solid #475569; border-radius:10px;
            background:#0f172a;color:#fff;outline:none;margin-bottom:18px;
        }
        input:focus{border-color:#38bdf8}
        button{
            width:100%;padding:13px;border:0;border-radius:10px;background:#0284c7;color:#fff;
            font-size:16px;font-weight:700;cursor:pointer;
        }
        button:hover{background:#0369a1}
        .alert{padding:12px;border-radius:10px;margin-bottom:18px;background:#7f1d1d;color:#fecaca}
        .hint{margin-top:18px;text-align:center;font-size:12px;color:#64748b}
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">🔔</div>
    <h1>Dashboard Bel Sekolah</h1>
    <p class="subtitle">Silakan masuk untuk mengelola sistem bel.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="post" autocomplete="on">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Masuk</button>
    </form>

    <div class="hint">Sistem Bel Sekolah • Flask + ESP32</div>
</div>
</body>
</html>
